{% extends 'base.html' %}

{% block title %}Konfirmasi Hapus Pasien{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-12 bg-white rounded-2xl shadow-sm border border-red-200 p-8 text-center">
    <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold text-slate-800 mb-2">Hapus Data Pasien?</h1>
    <p class="text-xs text-slate-600 mb-6">
        Apakah Anda yakin ingin menghapus data pasien <strong class="text-slate-800">{{ pasien.nama }}</strong> (NIM: {{ pasien.nim_id }})?
        Tindakan ini tidak dapat dibatalkan.
    </p>

    <form method="POST" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'pasien_list' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition">
            Batal
        </a>
        <button type="submit" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow-md shadow-red-600/20 transition flex items-center gap-1.5">
            <i class="fa-solid fa-trash-can"></i> Ya, Hapus Pasien
        </button>
    </form>
</div>
{% endblock %}
